components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AccountResponse:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        accountType:
          type: string
          enum:
            - SAVINGS
            - CHECKING
            - FIXED_TERM
            - VIP_SAVINGS
            - PYME_CHECKING
        balance:
          type: number
          format: double
#        minimumOpeningAmount:
#          type: number
#          format: double
#        maxFreeTransactions:
#          type: integer
#        maintenanceFee:
#          type: number
#          format: double

#        holders:
#          type: array
#          items:
#            $ref: '#/components/schemas/Holder'
#        signers:
#          type: array
#          items:
#            $ref: '#/components/schemas/Signer'
        createdAt:
          type: string
          format: date-time

    AccountCreateRequest:
      type: object
      required:
        - customerId
        - accountType
      properties:
        customerId:
          type: string
        accountType:
          type: string
        initialDeposit:
          type: number
          format: double

    AccountUpdateRequest:
      type: object
      properties:
        maintenanceFee:
          type: number
        maxFreeTransactions:
          type: integer

